<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Race Start Light - RevoU Day 3</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0f0f0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      gap: 24px;
    }

    h1 {
      color: #ffffff;
      font-size: 2rem;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    h1 span {
      color: #ff2d2d;
    }

    /* ===== PANEL LAMPU ===== */
    .race-panel {
      background-color: #1c1c1c;
      border: 3px solid #333;
      border-radius: 16px;
      padding: 28px 36px;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    }

    .light {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background-color: #2a2a2a;
      border: 3px solid #3a3a3a;
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
    }

    .light.red-on {
      background-color: #ff2d2d;
      box-shadow: 0 0 30px 10px rgba(255, 45, 45, 0.8);
      border-color: #ff6b6b;
    }

    .light.yellow-on {
      background-color: #ffd700;
      box-shadow: 0 0 30px 10px rgba(255, 215, 0, 0.8);
      border-color: #ffe44d;
    }

    .light.green-on {
      background-color: #39ff14;
      box-shadow: 0 0 30px 10px rgba(57, 255, 20, 0.8);
      border-color: #6fff4d;
    }

    /* ===== STATUS ===== */
    .status-label {
      font-size: 2.2rem;
      font-weight: bold;
      letter-spacing: 3px;
      color: #555;
      text-transform: uppercase;
      min-height: 50px;
      transition: color 0.3s;
    }

    .status-label.waiting  { color: #888; }
    .status-label.starting { color: #ff2d2d; }
    .status-label.yellow   { color: #ffd700; text-shadow: 0 0 16px #ffd700; }
    .status-label.go       { color: #39ff14; text-shadow: 0 0 20px #39ff14; }
    .status-label.false-start { color: #ff9900; }

    /* ===== TIMER ===== */
    .timer-display {
      font-size: 3.5rem;
      font-weight: bold;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
      letter-spacing: 2px;
      min-height: 60px;
    }

    .timer-display.running { color: #39ff14; }
    .timer-display.stopped { color: #ffd700; }

    /* ===== SETTING DURASI ===== */
    .settings-box {
      background-color: #1c1c1c;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 18px 28px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 340px;
    }

    .settings-box label {
      color: #aaa;
      font-size: 0.85rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .settings-box input[type="range"] {
      width: 100%;
      accent-color: #ff2d2d;
      cursor: pointer;
    }

    .settings-box .range-value {
      color: #fff;
      font-weight: bold;
      min-width: 50px;
      text-align: right;
    }

    /* ===== TOMBOL ===== */
    .btn-start {
      padding: 16px 50px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #fff;
      background-color: #ff2d2d;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: background-color 0.3s, transform 0.1s;
      box-shadow: 0 4px 20px rgba(255, 45, 45, 0.5);
    }

    .btn-start:hover  { background-color: #cc0000; }
    .btn-start:active { transform: scale(0.97); }
    .btn-start:disabled {
      background-color: #444;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-reset {
      padding: 10px 30px;
      font-size: 0.9rem;
      font-weight: bold;
      color: #fff;
      background-color: #333;
      border: 1px solid #555;
      border-radius: 50px;
      cursor: pointer;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: background-color 0.3s;
    }

    .btn-reset:hover { background-color: #444; }

    .btn-row {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    /* ===== REACTION TIME ===== */
    .reaction-box {
      color: #aaa;
      font-size: 0.95rem;
      letter-spacing: 1px;
      min-height: 24px;
    }

    .reaction-box span {
      color: #ffd700;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>🏎️ <span>RACE</span> START LIGHT</h1>

  <!-- 5 Lampu Balap Merah -->
  <div class="race-panel">
    <div class="light" id="light1"></div>
    <div class="light" id="light2"></div>
    <div class="light" id="light3"></div>
    <div class="light" id="light4"></div>
    <div class="light" id="light5"></div>
  </div>

  <!-- Status teks -->
  <p class="status-label waiting" id="statusLabel">READY</p>

  <!-- Timer balapan -->
  <div class="timer-display" id="timerDisplay">0.000s</div>

  <!-- Reaction time -->
  <div class="reaction-box" id="reactionBox"></div>

  <!-- Setting durasi -->
  <div class="settings-box">
    <div>
      <label>Jeda antar lampu</label>
      <div class="settings-row">
        <input type="range" id="intervalSlider" min="300" max="2000" step="100" value="800" />
        <span class="range-value" id="intervalValue">0.8s</span>
      </div>
    </div>
    <div>
      <label>Waktu sebelum GO (setelah lampu ke-5)</label>
      <div class="settings-row">
        <input type="range" id="goSlider" min="500" max="4000" step="250" value="2000" />
        <span class="range-value" id="goValue">2.0s</span>
      </div>
    </div>
  </div>

  <!-- Tombol -->
  <div class="btn-row">
    <button class="btn-start" id="startBtn">START RACE</button>
    <button class="btn-reset" id="resetBtn">RESET</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
